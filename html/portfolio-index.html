<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works — Wilson Ong</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/portfolio-index.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="pi-page">

  <!-- LEFT: sticky hero -->
  <div class="pi-hero-column">
    <a class="pi-hero-link" href="portfolio.html">
      <img class="pi-hero-image"
           src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d120ed0320a283f524_Wilson%20-%201.png"
           alt="">
      <span class="pi-hero-cta">Click →</span>
    </a>
  </div>

  <!-- RIGHT: header + filter + grid -->
  <div class="pi-content-column">

    <div class="pi-header">
      <a class="pi-number-link" href="portfolio.html">Ceramic</a>
      <div class="pi-arrow-row">
        <a href="#" class="pi-nav-arrow pi-prev">‹</a>
        <a href="#" class="pi-nav-arrow pi-next">›</a>
      </div>
      <h1 class="pi-title">Graduate Collection</h1>
      <p class="pi-year">2014</p>
    </div>

    <div class="pi-filter-wrap">
      <select class="pi-filter">
        <option value="all">All</option>
        <option value="fashion">Fashion</option>
        <option value="theatre">Theatre</option>
        <option value="collaboration">Collaboration</option>
      </select>
    </div>

    <div class="pi-grid">

      <!-- 1. Graduate Collection -->
      <div class="pi-card active"
           data-category="fashion"
           data-href="portfolio.html"
           data-number="Ceramic"
           data-title="Graduate Collection"
           data-year="2014"
           data-image="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d120ed0320a283f524_Wilson%20-%201.png">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d120ed0320a283f524_Wilson%20-%201.png" alt="Graduate Collection">
        <span class="pi-card-arrow">→</span>
      </div>

      <!-- 2. Second Year Collection -->
      <div class="pi-card"
           data-category="fashion"
           data-href="#"
           data-number="1138"
           data-title="Second Year Collection"
           data-year="2014"
           data-image="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d146e3fb9a03abf3d0_Wilson%20-%202.png">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d146e3fb9a03abf3d0_Wilson%20-%202.png" alt="Second Year Collection">
        <span class="pi-card-arrow">→</span>
      </div>

      <!-- 3. First Year Collection -->
      <div class="pi-card"
           data-category="fashion"
           data-href="#"
           data-number="First Year"
           data-title="First Year Collection"
           data-year="2013"
           data-image="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d1be8d5f49affad380_Wilson%20-%203.png">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d1be8d5f49affad380_Wilson%20-%203.png" alt="First Year Collection">
        <span class="pi-card-arrow">→</span>
      </div>

      <!-- 4. Personal Clothing Brand -->
      <div class="pi-card"
           data-category="fashion"
           data-href="#"
           data-number="Independent Label"
           data-title="Personal Clothing Brand"
           data-year="2020 —"
           data-image="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d12ef3882afc8040e1_Wilson%20-%204.png">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d12ef3882afc8040e1_Wilson%20-%204.png" alt="Personal Clothing Brand">
        <span class="pi-card-arrow">→</span>
      </div>

      <!-- 5. Pork & Poll Taxes -->
      <div class="pi-card"
           data-category="theatre"
           data-href="#"
           data-number="Costume Design"
           data-title="Pork & Poll Taxes"
           data-year="2021"
           data-image="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d120ed0320a283f524_Wilson%20-%201.png">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d120ed0320a283f524_Wilson%20-%201.png" alt="Pork & Poll Taxes">
        <span class="pi-card-arrow">→</span>
      </div>

      <!-- 6. This Room Is An Island -->
      <div class="pi-card"
           data-category="theatre"
           data-href="#"
           data-number="Costume Design"
           data-title="This Room Is An Island"
           data-year="2023"
           data-image="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d146e3fb9a03abf3d0_Wilson%20-%202.png">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d146e3fb9a03abf3d0_Wilson%20-%202.png" alt="This Room Is An Island">
        <span class="pi-card-arrow">→</span>
      </div>

      <!-- 7. National Contemporary Art Awards -->
      <div class="pi-card"
           data-category="collaboration"
           data-href="#"
           data-number="Collaboration"
           data-title="National Contemporary Art Awards"
           data-year="2019"
           data-image="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d1be8d5f49affad380_Wilson%20-%203.png">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d1be8d5f49affad380_Wilson%20-%203.png" alt="National Contemporary Art Awards">
        <span class="pi-card-arrow">→</span>
      </div>

    </div>
  </div>

</div>

<script src="../js/portfolio-index.js"></script>
