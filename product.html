<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain Jacket — Wilson Ong</title>

  <!-- Local CSS files for testing -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/product-page.css">
  <link rel="stylesheet" href="css/carousel.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="product-page">
  <!-- LEFT COLUMN: IMAGE (FULL BLEED, STICKY) -->
  <div class="product-images-column">
    <div class="product-images-container">
      <!-- Image Section 1 -->
      <div class="product-image-section">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d120ed0320a283f524_Wilson%20-%201.png" class="product-image" alt="Product Image 1">
      </div>

      <!-- Image Section 2 -->
      <div class="product-image-section">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d146e3fb9a03abf3d0_Wilson%20-%202.png" class="product-image" alt="Product Image 2">
      </div>

      <!-- Image Section 3 -->
      <div class="product-image-section">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d1be8d5f49affad380_Wilson%20-%203.png" class="product-image" alt="Product Image 3">
      </div>

      <!-- Image Section 4 -->
      <div class="product-image-section">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d12ef3882afc8040e1_Wilson%20-%204.png" class="product-image" alt="Product Image 4">
      </div>

      <!-- Image Section 5 -->
      <div class="product-image-section">
        <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d120ed0320a283f524_Wilson%20-%201.png" class="product-image" alt="Product Image 5">
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN: PRODUCT DETAILS (CENTERED) -->
  <div class="product-details-column">
    <div class="product-details-fixed">
      <h1 class="product-title">Double Pocket Shirt</h1>
      <p class="product-subtitle">Charcoal Silk</p>
      <p class="product-price">$549</p>

      <div class="product-description">
        <p>Slate Silk Twill Shirt</p>
        <br>
        <p>Front utility side entry pockets</p>
        <p>Self bound cuff placket</p>
        <p>Italian corozo buttons</p>
        <p>Flat felled seams throughout</p>
        <br>
        <p>100% Korean Silk</p>
        <br>
        <p>Made in New Zealand</p>
      </div>

      <div class="product-options">
        <select class="size-selector">
          <option value="">SELECT A SIZE</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>

      <button class="add-to-bag">PURCHASE</button>
    </div>
  </div>
</div>

<!-- CAROUSEL LIGHTBOX MODAL -->
<div class="carousel-modal">
  <button class="carousel-close">&times;</button>
  <button class="carousel-prev">‹</button>

  <div class="carousel-images">
    <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d120ed0320a283f524_Wilson%20-%201.png" class="carousel-image" alt="Product Image 1">
    <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d146e3fb9a03abf3d0_Wilson%20-%202.png" class="carousel-image" alt="Product Image 2">
    <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d1be8d5f49affad380_Wilson%20-%203.png" class="carousel-image" alt="Product Image 3">
    <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d12ef3882afc8040e1_Wilson%20-%204.png" class="carousel-image" alt="Product Image 4">
    <img src="https://cdn.prod.website-files.com/6a0919457e10b463b92b0086/6a0930d120ed0320a283f524_Wilson%20-%201.png" class="carousel-image" alt="Product Image 5">
  </div>

  <button class="carousel-next">›</button>

  <div class="carousel-counter">
    <span class="carousel-current">1</span> / <span class="carousel-total">5</span>
  </div>
</div>

<!-- Local JS files for testing -->
<script src="js/carousel.js"></script>
<script src="js/product-scroll.js"></script>

</body>
</html>
